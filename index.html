<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дашины учебники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Дашины учебники</h1>
      <p class="sub" id="authbar" hidden><span id="whoami"></span> <button class="btn" id="logout" type="button" hidden style="margin-left:8px;padding:4px 10px">Выйти</button></p>
    </div>
    <a class="planlink" href="https://claude.ai/artifact/HtGGDqkk4oDT2oA8HZoZvt" target="_blank" rel="noopener">План подготовки ↗</a>
  </header>
  <div id="streakbar" class="streakbar" hidden></div>
  <p class="note" id="savewarn" hidden><b>Не сохранилось.</b> Проверь интернет: изменения пока есть только на этом устройстве.</p>
  <div class="layout">
    <nav class="shelf" id="shelf" aria-label="Разделы"></nav>
    <main id="main"><p class="hint">Загружаю…</p></main>
  </div>
</div>

<aside id="reader" hidden aria-label="Учебник">
  <div id="rhandle" role="separator" aria-orientation="vertical" aria-label="Изменить ширину учебника" tabindex="0"></div>
  <div class="rbar">
    <div class="rtitle"><b id="rtitle"></b><small id="rsub"></small></div>
    <div class="rgroup">
      <button class="vbtn" id="rprev" type="button" aria-label="Предыдущая страница">‹</button>
      <label for="rpagein" class="sm">стр.</label><input id="rpagein" type="number">
      <button class="vbtn" id="rnext" type="button" aria-label="Следующая страница">›</button>
      <span id="rinfo" class="sm"></span>
    </div>
    <div class="rgroup">
      <button class="vbtn" id="rzout" type="button" aria-label="Уменьшить">−</button>
      <button class="vbtn" id="rzin" type="button" aria-label="Увеличить">+</button>
      <button class="vbtn" id="rdock" type="button">⇤ Влево</button>
      <button class="vbtn" id="rfull" type="button" aria-label="Во весь экран">⛶</button>
      <button class="vbtn" id="rclose" type="button" aria-label="Закрыть учебник">✕</button>
    </div>
    <div class="rgroup" role="toolbar" aria-label="Пометки">
      <button class="vbtn" data-rtool="view" type="button" aria-pressed="true">Листать</button>
      <button class="vbtn" data-rtool="pen" type="button" aria-pressed="false">Карандаш</button>
      <button class="vbtn" data-rtool="marker" type="button" aria-pressed="false">Маркер</button>
      <button class="vbtn" data-rtool="eraser" type="button" aria-pressed="false">Ластик</button>
      <button class="swatch sm-sw" data-rcolor="#d23c3c" style="background:#d23c3c" type="button" aria-label="Красный" aria-pressed="true"></button>
      <button class="swatch sm-sw" data-rcolor="#2a4fd6" style="background:#2a4fd6" type="button" aria-label="Синий" aria-pressed="false"></button>
      <button class="swatch sm-sw" data-rcolor="#1f8a5a" style="background:#1f8a5a" type="button" aria-label="Зелёный" aria-pressed="false"></button>
      <button class="vbtn" id="rundo" type="button">Отменить</button>
      <button class="vbtn" id="rnotebtn" type="button" aria-pressed="false">Заметки</button>
    </div>
  </div>
  <div class="rnotes" id="rnotes" hidden>
    <label for="rnote" id="rnotelabel" class="sm"></label>
    <textarea id="rnote" placeholder="Что важно запомнить на этой странице…"></textarea>
    <div id="rnotelist"></div>
  </div>
  <div id="rscroll"><p id="rmsg"></p><div id="rpage" hidden><canvas id="rcanvas"></canvas><canvas id="rink"></canvas></div></div>
</aside>

<script src="js/vendor/supabase.js"></script>
<script src="js/vendor/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = "js/vendor/pdf.worker.min.js";</script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/reader.js"></script>
<script src="js/avatar.js"></script>
<script src="js/points.js"></script>
<script src="js/oge.js"></script>
</body>
</html>
