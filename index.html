<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дашины учебники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Дашины учебники</h1>
      <p class="sub" id="authbar" hidden><span id="whoami"></span> <button class="btn" id="logout" type="button" hidden style="margin-left:8px;padding:4px 10px">Выйти</button></p>
    </div>
    <a class="planlink" href="https://claude.ai/artifact/HtGGDqkk4oDT2oA8HZoZvt" target="_blank" rel="noopener">План подготовки ↗</a>
  </header>
  <p class="note" id="savewarn" hidden><b>Не сохранилось.</b> Проверь интернет: изменения пока есть только на этом устройстве.</p>
  <div class="layout">
    <nav class="shelf" id="shelf" aria-label="Разделы"></nav>
    <main id="main"><p class="hint">Загружаю…</p></main>
  </div>
</div>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div class="vbar">
    <div class="vt"><span id="vtitle"></span><small id="vsub"></small></div>
    <div class="vnav">
      <button class="vbtn" id="vprev" type="button" aria-label="Предыдущая страница">‹</button>
      <label for="vpage" class="sm">стр.</label><input id="vpage" type="number">
      <button class="vbtn" id="vnext" type="button" aria-label="Следующая страница">›</button>
      <span id="vinfo"></span>
    </div>
    <div class="vnav">
      <button class="vbtn" id="vzout" type="button" aria-label="Уменьшить">−</button>
      <button class="vbtn" id="vzin" type="button" aria-label="Увеличить">+</button>
      <button class="vbtn" id="vclose" type="button" aria-label="Закрыть">✕</button>
    </div>
  </div>
  <div id="vscroll"><p id="vmsg"></p><canvas id="vcanvas" hidden></canvas></div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/vendor/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = "js/vendor/pdf.worker.min.js";</script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
